name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf "dist/asm-${{ matrix.target }}.tar.gz" asm
          shasum -a 256 "dist/asm-${{ matrix.target }}.tar.gz" > "dist/asm-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: asm-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -name 'asm-*.tar.gz*' -exec cp {} dist/ \;
          (cd dist && shasum -a 256 *.tar.gz | tee SHA256SUMS)
          ls -la dist
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  npm:
    name: publish npm
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: sync package version to tag
        working-directory: npm
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$version"
      - name: publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
